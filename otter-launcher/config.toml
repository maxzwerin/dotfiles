[general]
default_module = "app"
empty_module = "a"
exec_cmd = "sh -c"
vi_mode = true
esc_to_abort = true
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
clear_screen_after_execution = false
loop_mode = false
external_editor = ""

# \x1b should be replaced with \u001B
[interface]
header = """

  \u001B[34;1m$USER@$(printf $HOSTNAME)\u001B[0m
  󰘧 """
header_cmd = ""
header_cmd_trimmed_lines = 0
header_concatenate = false
list_prefix = "      "
selection_prefix = "    \u001B[31;1m> "
place_holder = ""
default_module_message = ""
empty_module_message = ""
suggestion_mode = "list"
suggestion_lines = 12
indicator_with_arg_module = "\u001B[34m+\u001B[0m "
indicator_no_arg_module = "\u001B[34m-\u001B[0m "
prefix_padding = 3
prefix_color = "\u001B[31m"
description_color = "\u001B[39m"
place_holder_color = "\u001B[30m"
hint_color = "\u001B[30m"
move_right = 0
move_up = 0

[[modules]]
description = "search the web"
prefix = "gg"
cmd = "setsid -f xdg-open 'https://duckduckgo.com/search?q={}'"
with_argument = true
url_encode = true

[[modules]]
description = "kill a running app"
prefix = "k"
cmd = 'ps -u "$USER" -o comm= | sort -u | fsel --dmenu | xargs -r pkill -9'
with_argument = true
url_encode = true

[[modules]]
description = "fsel launcher"
prefix = "a"
cmd = "fsel -vv -r -d -ss \"{}\""
with_argument = true

[[modules]]
description = "launchpad"
prefix = "app"
cmd = "fsel -vv -r -d -p {}"
with_argument = true

[[modules]]
description = "manage clipboard"
prefix = "cl"
cmd = "fsel --cclip"

[[modules]]
description = "find pkgs [AUR]"
prefix = "pm"
cmd = "xdg-open https://aur.archlinux.org/packages?K='{}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "power menu"
prefix = "pow"
cmd = """
function power {
if [[ -n $1 ]]; then
case $1 in
"logout") session=`loginctl session-status | head -n 1 | awk '{print $1}'`; loginctl terminate-session $session ;;
"suspend") systemctl suspend ;;
"hibernate") systemctl hibernate ;;
"reboot") systemctl reboot ;;
"shutdown") systemctl poweroff ;;
esac fi }
power $(echo -e 'reboot\nshutdown\nlogout\nsuspend\nhibernate' | fzf --reverse --no-scrollbar --padding 1,3 --prompt 'Power Menu: ' | tail -1)
"""

[[modules]]
description = "search archwiki"
prefix = "w"
cmd = "setsid -f xdg-open https://wiki.archlinux.org/index.php?search='{}'"
with_argument = true
url_encode = true
