env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

monitor=DP-1,2560x1440@240.00Hz,auto,1

exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar &
exec-once = cclipd -s 2 -t "image/png" -t "image/*" -t "text/plain;charset=utf-8" -t "text/*" -t "*"

$terminal = kitty 
$fileManager = dolphin
$browser = firefox 
$menu = kitty --class launcher -e otter-launcher
$waybar = pkill waybar; waybar &
$audio = kitty -e pulsemixer

$mod = ALT

bind = $mod, RETURN, exec, $terminal
bind = $mod, C, killactive,
bind = $mod, S, exec, $browser
bind = $mod, U, exec, $audio
bind = $mod, SPACE, exec, $menu
bind = $mod, F, fullscreen,
bind = $mod SHIFT, Y, exec, $waybar
bind = $mod SHIFT, K, exec, hyprlock
bind = $mod SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy

# Move focus / window
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Switch workspaces with mainMod + [1-5]
bind = $mod, Q, workspace, 1
bind = $mod, W, workspace, 2
bind = $mod, E, workspace, 3
bind = $mod, R, workspace, 4
bind = $mod, T, workspace, 5

# Move active window to a workspace with mainMod + SHIFT + [1-5]
bind = $mod SHIFT, Q, movetoworkspace, 1
bind = $mod SHIFT, W, movetoworkspace, 2
bind = $mod SHIFT, E, movetoworkspace, 3
bind = $mod SHIFT, R, movetoworkspace, 4
bind = $mod SHIFT, T, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume and Media Control
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

windowrule {
    name = launcher
    match:class = ^(launcher)$
    float = true
    center = true
    size = 500 430
}

dwindle {
    force_split = 2
}

input {
    kb_layout = us

    repeat_rate = 35
    repeat_delay = 200

    follow_mouse = 1

    sensitivity = 0
}

cursor {
    inactive_timeout = 30
    no_hardware_cursors = true
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1
}

animations {
    enabled = 0
}
